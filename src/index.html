<html lang="en">

<head>
    <title>Branching - 01</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <style type="text/css">
        body {
            background-color: #000000;
            margin: 0px;
            overflow: hidden;
        }
        #instructions {
            position:absolute;
            top: 40px;
            left: 50vw;
            color: white;
        }
        #warning {
            position:absolute;
            top: 10px;
            left: 50vw;
            color: white;
        }
    </style>
</head>

<body>
    <div id="warning">Under Construction</div>
    <div id="instructions">Click Anywhere</div>
    <div id="container"></div>

    <script type="text/javascript">

        var container, canvas, context, colorPicker;
        var WIDTH, HEIGHT;

        var branches, mouseX, mouseY;

        var selectedColor = "#ff0"

        init();
        setInterval(loop, 1000 / 60);

        function init() {
            container = document.getElementById('container');

            WIDTH = window.innerWidth;
            HEIGHT = window.innerHeight;

            canvas = document.createElement("canvas");
            canvas.width = WIDTH;
            canvas.height = HEIGHT;
            container.appendChild(canvas);

            context = canvas.getContext("2d");
            context.fillStyle = "rgb(0, 0, 0)";
            context.fillRect(0, 0, WIDTH, HEIGHT);

            branches = new Array();

            canvas.addEventListener('mousedown', onWindowMouseDown);
        }

        function onWindowMouseDown(e) {
            console.log("Mouse down event detected!");
            console.log(`Mouse coordinates: X=${e.clientX}, Y=${e.clientY}`);

            mouseX = e.clientX;
            mouseY = e.clientY;

            branches.push(new Branch(mouseX, mouseY, 1000));
            console.log("Branches array:", branches);
        }

        function loop() {
            context.beginPath();
            context.strokeStyle = getRandomBrightColor();

            for (var i = branches.length - 1; i >= 0; i--) {
                var branch = branches[i];
                branch.life++;

                context.moveTo(branch.x, branch.y);

                branch.rw += Math.random() - 0.5;
                branch.x += Math.cos(branch.rw) * branch.speed;
                branch.y += Math.sin(branch.rw) * branch.speed;

                context.lineTo(branch.x, branch.y);

                if (branch.life > branch.max_life || branch.x < 0 || branch.y < 0 || branch.x > WIDTH || branch.y > HEIGHT) {
                    branches.splice(i, 1); // Remove branch
                }

                if (Math.random() > 0.95 && branches.length < 1000) {
                    branches.push(new Branch(branch.x, branch.y, branch.max_life / 10));
                }
            }

            context.stroke();
            context.closePath();

            context.fillStyle = "rgba(0, 25, 25, 0.05)";
            context.fillRect(0, 0, WIDTH, HEIGHT);
        }

        function getRandomBrightColor() {
            const minBrightness = 50;
            const r = Math.floor(Math.random() * (256 - minBrightness) + minBrightness);
            const g = Math.floor(Math.random() * (256 - minBrightness) + minBrightness);
            const b = Math.floor(Math.random() * (256 - minBrightness) + minBrightness);
            return `rgb(${r}, ${g}, ${b})`;
        }


        var Branch = function (x, y, max_life) {
            this.life = 0;
            this.max_life = max_life;
            this.speed = Math.random() + 1;
            this.x = x;
            this.y = y;
            this.rw = Math.random() * 360;
        }

    </script>
</body>

</html>
